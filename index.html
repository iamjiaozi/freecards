<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>自由卡片</title>
<meta name="description" content="把想到的事随手记成卡片，再用拖拽摆出自己想要的顺序。数据只保存在本机。">
<meta name="theme-color" content="#12141a" id="metaTheme">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<script>
/* 首屏主题：必须在首次绘制前确定，避免闪色（VF-67 / NV-20） */
(function(){
  var ok={dark:1,light:1,indigo:1,paper:1}, t=null;
  try{ t=(JSON.parse(localStorage.getItem('freecards.v1')||'{}')||{}).theme; }catch(e){}
  if(!t||!ok[t]){
    try{ t=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'; }
    catch(e){ t='dark'; }
  }
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg-glow" aria-hidden="true"><span class="glow-a"></span><span class="glow-b"></span></div>

<header class="toolbar" id="toolbar">
  <div class="brand">
    <span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span class="appname">free note ver 1.0</span>
    <span class="count" id="countCapsule" aria-live="polite">0 张</span>
  </div>
  <nav class="actions" aria-label="工具栏">
    <button id="btnNew" class="btn primary" type="button" title="新建卡片">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 2.5v11M2.5 8h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="tlabel">新建卡片</span>
    </button>
    <div class="seg" role="group" aria-label="排序方式" id="sortSeg">
      <button type="button" data-sort="created" title="按创建时间排序">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 4.8V8l2.2 1.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span class="tlabel">创建时间</span>
      </button>
      <button type="button" data-sort="alpha" title="按字母排序">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M2.5 4.5h6M5.5 4.5v8M5.5 9.5l-2 3M5.5 9.5l2 3M11 12.5l3-8 3 8M12 10h4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="tlabel">字母</span>
      </button>
      <button type="button" data-sort="manual" title="按手动排序">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M5.5 7.5V3.8a1 1 0 0 1 2 0v3.2V2.8a1 1 0 0 1 2 0V7V3.6a1 1 0 0 1 2 0v6.2c0 2.4-1.8 4.2-4.2 4.2-1.9 0-3-1-4.1-2.9L1.6 8.6c-.5-.9.1-1.9 1.1-1.9.5 0 .9.2 1.2.6l1.6 2.1z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="tlabel">手动</span>
      </button>
    </div>
    <button id="btnDir" class="btn square" type="button" title="">
      <svg id="dirIconUp" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg id="dirIconDown" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" hidden><path d="M8 3v10M3.5 8.5L8 13l4.5-4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="btnTheme" class="btn" type="button" aria-haspopup="menu" aria-expanded="false" title="切换主题">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 1.8a6.2 6.2 0 1 0 0 12.4c.8 0 1.2-.5 1.2-1.1 0-.8-.7-1-.7-1.7 0-.8.6-1.3 1.5-1.3H11a2.9 2.9 0 0 0 2.9-2.9C13.9 4 11.2 1.8 8 1.8z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="5.4" cy="6.2" r="1.1" fill="currentColor"/><circle cx="8.2" cy="4.6" r="1.1" fill="currentColor"/><circle cx="11" cy="6.4" r="1.1" fill="currentColor"/></svg>
      <span class="tlabel" id="themeLabel">深色</span>
    </button>
    <button id="btnMulti" class="btn" type="button" aria-pressed="false" title="多选卡片">
      <svg id="multiIconCheck" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path id="multiIconTick" d="M5 8.2l2.2 2.2L11.5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg id="multiIconX" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" hidden><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span class="tlabel" id="multiLabel">多选</span>
    </button>
  </nav>
  <div class="batchbar" id="batchBar" hidden>
    <span class="batchcount">已选 <b id="selCount">0</b> 张</span>
    <button id="btnBatchDel" class="btn danger" type="button" title="">删除选中</button>
  </div>
</header>

<main class="board" id="board">
  <div class="grid" id="grid" role="list" aria-label="卡片墙"></div>
  <div class="empty" id="emptyHint" hidden>
    <p>还没有卡片。点上方的「新建卡片」写点什么，按 <kbd id="emptyMod">⌘</kbd>+回车就会落成一张卡片。</p>
  </div>
</main>

<footer class="footbar">
  <p class="hint" id="modeHint"></p>
  <p class="privacy">数据仅保存在本机浏览器，不上传任何服务器</p>
</footer>

<div class="overlay" id="modalOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="modalBox">
    <h2 class="sr-only" id="modalTitle">新建卡片</h2>
    <div class="typeseg" role="group" aria-label="卡片类型" id="typeSeg">
      <button type="button" data-type="text" aria-pressed="true">文本</button>
      <button type="button" data-type="url" aria-pressed="false">网址</button>
      <button type="button" data-type="word" aria-pressed="false">单词</button>
    </div>
    <div class="modalcard" id="modalCard">
      <button class="x" id="modalClose" type="button" aria-label="关闭，不建卡">✕</button>
      <div class="fields" id="modalFields"></div>
    </div>
    <div class="keyhint" id="modalKeyHint"></div>
  </div>
</div>

<div class="menu" id="ctxMenu" role="menu" hidden></div>
<div class="panel" id="themePanel" role="menu" aria-label="选择主题" hidden></div>

<div class="toast" id="toast" role="status" hidden>
  <span class="toast-text" id="toastText"></span>
  <button class="toast-undo" id="toastUndo" type="button">撤销</button>
  <button class="toast-x" id="toastX" type="button" aria-label="关闭提示">✕</button>
</div>

<script src="app.js"></script>
</body>
</html>
